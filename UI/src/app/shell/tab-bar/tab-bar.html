<nav class="flex overflow-x-auto bg-[var(--vsc-panel)] border-b border-[var(--vsc-border)]">
  @for (item of navItems(); track item.path) {
    <a
      [routerLink]="item.path ? ['/', item.path] : ['/']"
      routerLinkActive="text-[var(--vsc-accent)] border-b-2 border-[var(--vsc-accent)] bg-[var(--vsc-bg)]"
      [routerLinkActiveOptions]="{ exact: item.path === '' }"
      class="flex items-center gap-2 px-4 py-2 text-sm whitespace-nowrap border-r border-[var(--vsc-border)] text-gray-400 hover:text-gray-200 hover:bg-[var(--vsc-border)] cursor-pointer"
    >
      <span>{{ item.icon }}</span>
      <span>{{ item.label }}</span>
    </a>
  }
</nav>
