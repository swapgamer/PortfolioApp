<section class="p-6 sm:p-10 max-w-3xl">
  <h1 class="text-2xl sm:text-3xl font-bold">Testimonials</h1>

  <div class="mt-6 grid gap-4 sm:grid-cols-2">
    @for (t of entries; track t.authorName) {
      <blockquote class="rounded-lg border border-[var(--vsc-border)] bg-[var(--vsc-panel)] p-4">
        <p class="text-sm text-[var(--vsc-text)] leading-relaxed">“{{ t.quote }}”</p>
        <footer class="mt-3 text-sm text-[var(--vsc-text-dim)]">
          — {{ t.authorName }}{{ t.authorTitle ? ', ' + t.authorTitle : '' }}
        </footer>
      </blockquote>
    }
  </div>
</section>
